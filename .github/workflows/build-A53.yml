name: Build for installed OpenWrt snapshot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out usteer-ng
        uses: actions/checkout@v6
        with:
          path: usteer
          fetch-depth: 0

      - name: Fetch upstream release tags
        working-directory: usteer
        run: |
          git fetch --tags https://github.com/NilsRo/usteer-ng.git

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget \
            xsltproc zstd libelf-dev

      - name: Check out matching OpenWrt source
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch --depth=1 origin \
            83c6a8f3dbdc4ba0ca39c3b1ac6b9ad1689de703
          git -C openwrt checkout --detach FETCH_HEAD
          
      - name: Configure package build
        working-directory: openwrt
        run: |
          printf 'src-link action %s/usteer\n' \
            "$GITHUB_WORKSPACE" > feeds.conf

          ./scripts/feeds update action
          ./scripts/feeds install -p action usteer-ng

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_PACKAGE_usteer-ng=m
          EOF

          make defconfig
          grep -qx 'CONFIG_PACKAGE_usteer-ng=m' .config

      - name: Build toolchain and package
        working-directory: openwrt
        run: |
          make -j"$(nproc)" tools/install V=s
          make -j"$(nproc)" toolchain/install V=s
          make -j"$(nproc)" package/usteer-ng/compile V=s

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: usteer-ng-aarch64_cortex-a53-83c6a8f3db
          if-no-files-found: error
          path: openwrt/bin/packages/aarch64_cortex-a53/action/usteer-ng*.apk
